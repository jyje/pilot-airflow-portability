config:
  dag_processor:
    dag_bundle_config_list: >-
      [{"name":"dags-folder","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{}},
      {"name":"pilot-e03","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/airflow/pilot-profile/dags"}}]
    dag_importer_configs: >-
      [{"classpath":"airflow.sdk.importers.yaml_importer.YamlDagImporter"}]
  sdk:
    coordinators: >-
      {"pilot-node":{"classpath":"airflow.sdk.coordinators.node.NodeCoordinator","kwargs":{"node_executable":"/opt/airflow/pilot-profile/runtime/node","task_startup_timeout":45}},
      "pilot-go":{"classpath":"airflow.sdk.coordinators.executable.ExecutableCoordinator"},
      "pilot-java":{"classpath":"airflow.sdk.coordinators.java.JavaCoordinator","kwargs":{"java_executable":"/opt/airflow/pilot-profile/runtime/openjdk/bin/java","task_startup_timeout":45}}}
    queue_to_coordinator: '{"typescript":"pilot-node","golang":"pilot-go","jvm":"pilot-java"}'

dagProcessor:
  extraVolumes: &pilotVolumes
    - name: pilot-e03-dags
      configMap:
        name: pilot-e03-dags
  extraVolumeMounts: &pilotMounts
    - name: logs
      mountPath: /opt/airflow/pilot-profile
      subPath: .pilot-mixed-profile-20261124
      readOnly: true
    - name: pilot-e03-dags
      mountPath: /opt/airflow/pilot-profile/dags/reconcile.py
      subPath: reconcile.py
      readOnly: true
    - name: pilot-e03-dags
      mountPath: /opt/airflow/pilot-profile/dags/chain.yaml
      subPath: chain.yaml
      readOnly: true
    - name: pilot-e03-dags
      mountPath: /opt/airflow/pilot-profile/dags/settlement.min.mjs
      subPath: settlement.min.mjs
      readOnly: true

workers:
  kubernetes:
    extraVolumes: *pilotVolumes
    extraVolumeMounts: *pilotMounts
