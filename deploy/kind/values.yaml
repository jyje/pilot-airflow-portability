images:
  airflow:
    pullPolicy: IfNotPresent

config:
  workers:
    execution_api_timeout: "45"

# Give the control plane and Airflow time to start on a shared local host.
apiServer:
  startupProbe:
    failureThreshold: 36
scheduler:
  startupProbe:
    failureThreshold: 36

# The baseline uses no deferrable operators or StatsD metrics.
triggerer:
  enabled: false
statsd:
  enabled: false
