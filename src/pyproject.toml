[project]
name = "pilot-airflow-portability"
version = "0.1.0"
description = "Compare one Airflow DAG across local, kind, and multi-node Kubernetes."
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2", "typer>=0.16,<1"]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "jupyterlab>=4", "matplotlib>=3.9", "nbconvert>=7", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "ty>=0.0.12"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pilot_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "RUF", "ISC", "TRY"]
ignore = ["TRY003"]

[tool.ty.src]
# The DAG runs inside the Airflow image, where airflow.sdk is available.
exclude = ["dags"]
