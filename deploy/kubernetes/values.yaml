airflowVersion: "3.4.0"
defaultAirflowRepository: apache/airflow
defaultAirflowTag: "3.4.0"
executor: KubernetesExecutor
config:
  core:
    dags_folder: /opt/airflow/pilot-dags
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false
volumes:
  - name: pilot-dags
    configMap:
      name: airflow-pilot-dags
volumeMounts:
  - name: pilot-dags
    mountPath: /opt/airflow/pilot-dags/portability.py
    subPath: portability.py
    readOnly: true
